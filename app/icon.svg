<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0f1115" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Monogram LP. -->
  <g transform="translate(0, 0)">
    <!-- Text LP -->
    <text x="215" y="325" 
          font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" 
          font-weight="900" 
          font-size="210" 
          fill="#ffffff" 
          text-anchor="middle" 
          letter-spacing="-6">LP</text>
    
    <!-- Accent Dot . -->
    <circle cx="365" cy="305" r="28" fill="url(#primaryGrad)" />
  </g>
</svg>
